<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thomas Logé — 3D viewer</title>
    <meta
      name="description"
      content="Interactive 3D model viewer: orbit, zoom and inspect Thomas Logé's Blender scenes."
    />
    <link rel="stylesheet" href="../css/styles.css?v=20260926g" />
  </head>
  <body class="viewer-page">
    <div class="viewer-shell">
      <header class="viewer-topbar">
        <a class="brand" href="../index.html">Thomas Logé — 3D viewer</a>
        <button class="viewer-menu-toggle" type="button" aria-expanded="false" aria-controls="viewerNav">
          <span class="sr-only">Open navigation</span>
          <span aria-hidden="true">☰</span>
        </button>
        <nav id="viewerNav" class="nav-links" aria-label="Viewer navigation">
          <a href="../index.html">Home</a>
          <a href="viewer.html" class="active">Model</a>
        </nav>
      </header>

      <main class="viewer-main">
        <div id="viewerContainer" class="viewer-canvas">
          <div id="viewerStatus" class="viewer-status" role="status">
            <p id="viewerStatusText">Loading model…</p>
            <div class="viewer-progress" aria-hidden="true"><span id="viewerProgress"></span></div>
          </div>

          <div class="viewer-tools">
            <button id="resetViewBtn" type="button">Reset view</button>
            <button id="loadLocalBtn" type="button">Open .glb</button>
            <input id="localFileInput" type="file" accept=".glb,.gltf" hidden />
          </div>

          <p id="viewerHint" class="viewer-hint">
            <span>Drag to rotate</span>
            <span>Scroll or pinch to zoom</span>
            <span class="keys-only">Right-drag to move</span>
            <span class="keys-only"><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> rotate</span>
            <span class="keys-only"><kbd>+</kbd><kbd>−</kbd> zoom · <kbd>R</kbd> reset</span>
          </p>
        </div>
      </main>
    </div>

    <script type="importmap">
      {"imports":{"three":"../js/libs/package/build/three.module.js"}}
    </script>
    <script type="module" src="../js/viewer.js?v=20260926b"></script>
  </body>
</html>
